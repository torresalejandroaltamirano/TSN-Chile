name: TSN Chile - APK y AAB firmados
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener versión aprobada
        uses: actions/checkout@v4
        with:
          ref: cierre-tsn-1.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar secretos de firma
        env:
          TSN_KEYSTORE_BASE64: ${{ secrets.TSN_KEYSTORE_BASE64 }}
          TSN_STORE_PASSWORD: ${{ secrets.TSN_KEYSTORE_PASSWORD }}
          TSN_KEY_ALIAS: ${{ secrets.TSN_KEY_ALIAS }}
          TSN_KEY_PASSWORD: ${{ secrets.TSN_KEY_PASSWORD }}
        run: |
          test -n "$TSN_KEYSTORE_BASE64" || { echo "Falta TSN_KEYSTORE_BASE64"; exit 1; }
          test -n "$TSN_STORE_PASSWORD" || { echo "Falta TSN_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$TSN_KEY_ALIAS" || { echo "Falta TSN_KEY_ALIAS"; exit 1; }
          test -n "$TSN_KEY_PASSWORD" || { echo "Falta TSN_KEY_PASSWORD"; exit 1; }
          printf '%s' "$TSN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tsn-release.jks"
          chmod 600 "$RUNNER_TEMP/tsn-release.jks"
          echo "TSN_KEYSTORE_PATH=$RUNNER_TEMP/tsn-release.jks" >> "$GITHUB_ENV"
      - name: Instalar SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Instalar Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
      - name: Compilar APK y AAB release
        env:
          TSN_STORE_PASSWORD: ${{ secrets.TSN_KEYSTORE_PASSWORD }}
          TSN_KEY_ALIAS: ${{ secrets.TSN_KEY_ALIAS }}
          TSN_KEY_PASSWORD: ${{ secrets.TSN_KEY_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verificar APK firmada
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          PACKAGE_INFO=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          if ! grep -Fq "package: name='cl.tsnchile.app'" <<< "$PACKAGE_INFO"; then
            echo "::error::El paquete APK no corresponde a cl.tsnchile.app"
            exit 1
          fi
          # Android empaqueta los recursos con rutas calificadas y nombres compilados.
          # El logo aprobado ya se comprueba en el manifiesto del proyecto.
          echo "APK firmada, paquete correcto y AAB generada."
      - name: Subir APK y AAB firmados
        uses: actions/upload-artifact@v4
        with:
          name: TSN-Chile-Release-Firmado
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
