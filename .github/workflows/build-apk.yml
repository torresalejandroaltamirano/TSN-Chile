name: Build TSN Chile Android

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Restore release keystore
        if: ${{ secrets.TSN_KEYSTORE_BASE64 != '' }}
        env:
          TSN_KEYSTORE_BASE64: ${{ secrets.TSN_KEYSTORE_BASE64 }}
        run: echo "$TSN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tsn-release.jks"

      - name: Build signed release APK and AAB
        if: ${{ secrets.TSN_KEYSTORE_BASE64 != '' }}
        env:
          TSN_KEYSTORE_PATH: ${{ runner.temp }}/tsn-release.jks
          TSN_KEYSTORE_PASSWORD: ${{ secrets.TSN_KEYSTORE_PASSWORD }}
          TSN_KEY_ALIAS: ${{ secrets.TSN_KEY_ALIAS }}
          TSN_KEY_PASSWORD: ${{ secrets.TSN_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: TSN-Chile-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: ${{ secrets.TSN_KEYSTORE_BASE64 != '' }}
        with:
          name: TSN-Chile-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
