name: TSN Chile - APK y AAB firmados
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar secretos de firma
        env:
          TSN_KEYSTORE_BASE64: ${{ secrets.TSN_KEYSTORE_BASE64 }}
          TSN_STORE_PASSWORD: ${{ secrets.TSN_STORE_PASSWORD }}
          TSN_KEY_ALIAS: ${{ secrets.TSN_KEY_ALIAS }}
          TSN_KEY_PASSWORD: ${{ secrets.TSN_KEY_PASSWORD }}
        run: |
          test -n "$TSN_KEYSTORE_BASE64" || { echo "Falta TSN_KEYSTORE_BASE64"; exit 1; }
          test -n "$TSN_STORE_PASSWORD" || { echo "Falta TSN_STORE_PASSWORD"; exit 1; }
          test -n "$TSN_KEY_ALIAS" || { echo "Falta TSN_KEY_ALIAS"; exit 1; }
          test -n "$TSN_KEY_PASSWORD" || { echo "Falta TSN_KEY_PASSWORD"; exit 1; }
          printf '%s' "$TSN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tsn-release.jks"
          chmod 600 "$RUNNER_TEMP/tsn-release.jks"
          echo "TSN_KEYSTORE_PATH=$RUNNER_TEMP/tsn-release.jks" >> "$GITHUB_ENV"
      - name: Instalar SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Instalar Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
      - name: Compilar APK y AAB release
        env:
          TSN_STORE_PASSWORD: ${{ secrets.TSN_STORE_PASSWORD }}
          TSN_KEY_ALIAS: ${{ secrets.TSN_KEY_ALIAS }}
          TSN_KEY_PASSWORD: ${{ secrets.TSN_KEY_PASSWORD }}
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verificar APK firmada
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='cl.tsnchile.app'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$APK" | grep -q 'res/drawable-nodpi/tsn_logo_aprobado'
      - name: Subir APK y AAB firmados
        uses: actions/upload-artifact@v4
        with:
          name: TSN-Chile-Release-Firmado
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
