name: Android APK de prueba
on:
  workflow_dispatch:
  push:
    branches: [cierre-tsn-1.0]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-debug.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
      - name: Compilar APK debug
        run: ./gradle-8.11.1/bin/gradle --no-daemon :app:assembleDebug
      - name: Verificar firma APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Verificar identidad e icono Android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | head -25
          printf '%s\n' "$BADGING" | grep -q "package: name='cl.tsnchile.app'"
          printf '%s\n' "$BADGING" | grep -q "application-label:'TSN Chile'"
          printf '%s\n' "$BADGING" | grep -q "application-icon-"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$APK" | grep -q 'res/drawable/tsn_launcher'
          test "$(stat -c%s "$APK")" -gt 8000
      - uses: actions/upload-artifact@v4
        with:
          name: TSN-Chile-APK-Prueba
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
